[package]
name = "inkit"
version = "1.0.0"
description = "InkIt - Yeib Ecosystem"
authors = ["Yeib"]
repository = "https://github.com/yeib/InkIt"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "inkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
flate2 = "1.0"
anyhow = "1.0"
time = "0.3"


openssl = "0.10"
tauri-plugin-shell = "2.3.6"

